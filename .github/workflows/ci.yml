name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify runner prerequisites
        shell: bash
        run: |
          # The runner user has no privilege escalation, so never install packages here. Without
          # ripgrep on PATH the grep tool tests fall back to an unauthenticated GitHub download, so
          # require it up front. cairo/pango headers only matter for compiling `canvas`, which
          # `npm ci --ignore-scripts` never builds.
          if ! command -v rg >/dev/null 2>&1; then
            echo "::error title=Missing runner prerequisite::ripgrep (rg) is not on PATH. This job cannot install packages (no sudo); ask the runner administrator to preinstall ripgrep."
            exit 1
          fi
          rg --version | head -n 1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Enforce certified release-only version bumps
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/release-pr-version-policy.js "${{ github.event.pull_request.base.sha }}"

      - name: Enforce release-note fragments for material changes
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/release-pr-fragment-policy.js "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Test with coverage
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run test:unit:coverage
          npm run test:coverage:check -- --base "$COVERAGE_BASE_SHA"

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            packages/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14
